<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Feedback Loop</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: rgba(255, 255, 255, 0.86);
            --surface-strong: #ffffff;
            --ink: #101828;
            --muted: #667085;
            --muted-soft: #98a2b3;
            --line: rgba(16, 24, 40, 0.12);
            --blue: #0071e3;
            --blue-soft: rgba(0, 113, 227, 0.12);
            --green: #027a48;
            --orange: #b54708;
            --red: #b42318;
            --shadow: 0 24px 70px rgba(16, 24, 40, 0.14);
            --card-shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
            color: var(--ink);
            background:
                radial-gradient(circle at 16% 8%, rgba(0, 113, 227, 0.16), transparent 30%),
                radial-gradient(circle at 88% 18%, rgba(52, 211, 153, 0.12), transparent 24%),
                linear-gradient(180deg, #fbfcff, var(--bg));
            font-family: "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Pretendard", sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .phone {
            width: min(430px, calc(100vw - 16px));
            min-height: min(920px, calc(100vh - 16px));
            position: relative;
            overflow: hidden;
            border-radius: 36px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(248, 250, 252, 0.92));
            box-shadow: var(--shadow);
            backdrop-filter: blur(24px);
        }

        .phone::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 18% 0%, rgba(0, 113, 227, 0.08), transparent 28%),
                radial-gradient(circle at 100% 12%, rgba(125, 211, 252, 0.10), transparent 22%);
            pointer-events: none;
        }

        .notch {
            width: 138px;
            height: 28px;
            margin: 0 auto 4px;
            border-radius: 0 0 18px 18px;
            background: rgba(17, 24, 39, 0.92);
        }

        .top,
        .screen,
        .tabbar {
            position: relative;
            z-index: 1;
        }

        .top {
            padding: 12px 18px 10px;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .identity {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: end;
            gap: 12px;
        }

        .eyebrow {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: 34px;
            line-height: 1.02;
            letter-spacing: 0;
        }

        .user-switcher {
            display: grid;
            gap: 6px;
            min-width: 148px;
        }

        .user-switcher label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
        }

        select,
        input,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--ink);
            outline: none;
        }

        select,
        input {
            min-height: 40px;
            padding: 0 12px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
            padding: 12px;
            line-height: 1.5;
        }

        .screen {
            height: calc(min(920px, 100vh - 16px) - 162px);
            overflow-y: auto;
            padding: 0 18px 96px;
            scrollbar-width: none;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        .section {
            display: none;
            animation: rise 220ms ease both;
        }

        .section.active {
            display: block;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero {
            display: grid;
            gap: 12px;
            margin-bottom: 14px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            background:
                linear-gradient(135deg, rgba(0, 113, 227, 0.14), rgba(255, 255, 255, 0.88)),
                var(--surface);
            box-shadow: var(--card-shadow);
        }

        .hero strong {
            font-size: 18px;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat {
            padding: 10px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.76);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .stat b {
            display: block;
            font-size: 18px;
        }

        .stat span {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .segments {
            display: flex;
            gap: 6px;
            padding: 4px;
            border-radius: 14px;
            background: rgba(16, 24, 40, 0.06);
        }

        .segment {
            min-height: 32px;
            padding: 0 10px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .segment.active {
            background: #fff;
            color: var(--ink);
            box-shadow: 0 6px 16px rgba(16, 24, 40, 0.08);
        }

        .primary,
        .secondary,
        .ghost {
            min-height: 42px;
            border: 0;
            border-radius: 12px;
            padding: 0 14px;
            font-weight: 800;
        }

        .primary {
            color: #fff;
            background: var(--blue);
            box-shadow: 0 12px 24px rgba(0, 113, 227, 0.22);
        }

        .secondary {
            color: var(--blue);
            background: var(--blue-soft);
        }

        .ghost {
            color: var(--muted);
            background: rgba(16, 24, 40, 0.06);
        }

        .grid-two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .feed-list,
        .stack {
            display: grid;
            gap: 10px;
        }

        .work-row,
        .panel,
        .comment,
        .person {
            border: 1px solid rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: 0 10px 24px rgba(16, 24, 40, 0.07);
            backdrop-filter: blur(18px);
        }

        .work-row {
            width: 100%;
            display: grid;
            gap: 10px;
            padding: 14px;
            text-align: left;
        }

        .work-row.active {
            border-color: rgba(0, 113, 227, 0.42);
            box-shadow: 0 14px 30px rgba(0, 113, 227, 0.14);
        }

        .row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .creator {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .avatar {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 50%;
            color: #fff;
            background: linear-gradient(135deg, #111827, #475467);
            font-weight: 900;
        }

        .creator b,
        .person b {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
        }

        .creator span,
        .meta,
        .muted {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            padding: 0 9px;
            border-radius: 999px;
            background: rgba(16, 24, 40, 0.06);
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .chip.blue {
            background: var(--blue-soft);
            color: var(--blue);
        }

        .chip.green {
            background: rgba(2, 122, 72, 0.10);
            color: var(--green);
        }

        .chip.orange {
            background: rgba(181, 71, 8, 0.10);
            color: var(--orange);
        }

        .title {
            margin: 0;
            font-size: 18px;
            line-height: 1.25;
        }

        .summary {
            margin: 0;
            color: var(--muted);
            line-height: 1.52;
        }

        .metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .insight-grid {
            display: grid;
            gap: 10px;
            margin: 12px 0;
        }

        .insight-card {
            display: grid;
            gap: 8px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.68);
        }

        .insight-card h4 {
            margin: 0;
            font-size: 13px;
            letter-spacing: 0;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 76px 1fr 34px;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .bar {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(16, 24, 40, 0.08);
        }

        .bar span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--blue), #34d399);
        }

        .insight-summary {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .panel {
            padding: 14px;
            margin-top: 12px;
        }

        .panel h2,
        .panel h3 {
            margin: 0 0 10px;
            letter-spacing: 0;
        }

        .panel h2 {
            font-size: 22px;
        }

        .panel h3 {
            font-size: 16px;
        }

        .form {
            display: grid;
            gap: 10px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .comment {
            padding: 12px;
        }

        .comment p {
            margin: 8px 0 0;
            line-height: 1.52;
        }

        .empty {
            padding: 18px;
            border: 1px dashed var(--line);
            border-radius: 14px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
            text-align: center;
        }

        .person {
            display: grid;
            grid-template-columns: 38px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 12px;
        }

        .person.active {
            border-color: rgba(0, 113, 227, 0.42);
        }

        .notice {
            margin: 10px 0 0;
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
            min-height: 18px;
        }

        .tabbar {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 14px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.88);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 16px 36px rgba(16, 24, 40, 0.14);
            backdrop-filter: blur(22px);
        }

        .tab {
            min-height: 48px;
            display: grid;
            place-items: center;
            gap: 2px;
            border: 0;
            border-radius: 16px;
            background: transparent;
            color: var(--muted);
            font-size: 11px;
            font-weight: 900;
        }

        .tab span {
            font-size: 18px;
            line-height: 1;
        }

        .tab.active {
            color: var(--blue);
            background: var(--blue-soft);
        }

        @media (max-width: 390px) {
            body {
                padding: 0;
            }

            .phone {
                width: 100vw;
                min-height: 100vh;
                border-radius: 0;
            }

            .screen {
                height: calc(100vh - 162px);
            }

            .identity {
                grid-template-columns: 1fr;
                align-items: start;
            }
        }
    </style>
</head>
<body>
    <main class="phone" aria-label="Feedback Loop 앱 데모">
        <div class="notch"></div>
        <header class="top">
            <div class="status-row">
                <span>Demo Community</span>
                <a class="muted" href="/ops/">Ops API</a>
            </div>
            <div class="identity">
                <div>
                    <p class="eyebrow">Creative Feedback</p>
                    <h1>Feedback Loop</h1>
                </div>
                <div class="user-switcher">
                    <label for="activeUser">현재 사용자</label>
                    <select id="activeUser"></select>
                </div>
            </div>
        </header>

        <div class="screen">
            <section class="section active" data-section="feed">
                <div class="hero">
                    <div>
                        <strong>여러 사람이 올린 작품을 한 피드에서 봅니다.</strong>
                        <p>상단의 현재 사용자를 바꾸면 업로드, 댓글, 신고가 그 사람 이름으로 기록됩니다.</p>
                    </div>
                    <div class="stats" id="stats"></div>
                    <button class="primary" id="seedCommunity" type="button">커뮤니티 샘플 채우기</button>
                </div>

                <div class="toolbar">
                    <div class="segments" aria-label="피드 필터">
                        <button class="segment active" type="button" data-mode="all">전체</button>
                        <button class="segment" type="button" data-mode="latest">최신</button>
                        <button class="segment" type="button" data-mode="mine">내 작품</button>
                    </div>
                    <button class="secondary" id="refresh" type="button">새로고침</button>
                </div>

                <div class="feed-list" id="feedList"></div>
                <article class="panel" id="workDetail"></article>
            </section>

            <section class="section" data-section="upload">
                <div class="panel">
                    <h2>작품 올리기</h2>
                    <p class="muted">현재 사용자로 공개 작품을 등록합니다. 실제 파일 업로드 전 단계라 URL 기반 자산으로 저장합니다.</p>
                    <form class="form" id="workForm">
                        <div class="field">
                            <label for="workTitle">작품명</label>
                            <input id="workTitle" name="title" value="새 영상 러프컷" required>
                        </div>
                        <div class="field">
                            <label for="workSummary">짧은 설명</label>
                            <input id="workSummary" name="summary" value="감정선과 리듬이 의도대로 전달되는지 궁금합니다.">
                        </div>
                        <div class="field">
                            <label for="workIntent">제작 의도</label>
                            <textarea id="workIntent" name="creator_intent" required>처음 보는 사람도 마지막 장면에서 여운을 느끼는지 확인하고 싶습니다.</textarea>
                        </div>
                        <div class="grid-two">
                            <div class="field">
                                <label for="workMedia">미디어</label>
                                <select id="workMedia" name="media_type">
                                    <option value="video">영상</option>
                                    <option value="image">이미지</option>
                                    <option value="audio">오디오</option>
                                    <option value="illustration">그림</option>
                                    <option value="other">기타</option>
                                </select>
                            </div>
                            <div class="field">
                                <label for="assetUrl">자산 URL</label>
                                <input id="assetUrl" name="asset_url" type="url" value="https://example.com/demo-work.mp4">
                            </div>
                        </div>
                        <button class="primary" type="submit">현재 사용자로 등록</button>
                    </form>
                    <p class="notice" id="workNotice"></p>
                </div>

                <div class="panel">
                    <h3>새 페르소나 만들기</h3>
                    <form class="form" id="userForm">
                        <div class="grid-two">
                            <div class="field">
                                <label for="handle">닉네임</label>
                                <input id="handle" name="public_handle" value="creator-new" maxlength="24" required>
                            </div>
                            <div class="field">
                                <label for="ageGroup">연령대</label>
                                <select id="ageGroup" name="age_group">
                                    <option value="10s">10대</option>
                                    <option value="20s" selected>20대</option>
                                    <option value="30s">30대</option>
                                    <option value="40s">40대</option>
                                    <option value="50s">50대</option>
                                    <option value="60s">60대</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid-two">
                            <div class="field">
                                <label for="country">국가</label>
                                <input id="country" name="country_code" value="KR" maxlength="2">
                            </div>
                            <div class="field">
                                <label for="gender">성별</label>
                                <select id="gender" name="gender">
                                    <option value="undisclosed">미공개</option>
                                    <option value="female">여성</option>
                                    <option value="male">남성</option>
                                    <option value="non_binary">논바이너리</option>
                                </select>
                            </div>
                        </div>
                        <div class="field">
                            <label for="bio">관심사</label>
                            <input id="bio" name="bio" value="영상 리듬과 감정 피드백에 관심이 있습니다.">
                        </div>
                        <button class="secondary" type="submit">사용자 추가 후 전환</button>
                    </form>
                    <p class="notice" id="userNotice"></p>
                </div>
            </section>

            <section class="section" data-section="activity">
                <div class="panel">
                    <h2>피드백 활동</h2>
                    <p class="muted">작품을 선택한 뒤 현재 사용자로 댓글을 남기거나 신고 흐름을 테스트합니다.</p>
                    <form class="form" id="reportForm">
                        <div class="field">
                            <label for="reportReason">선택 작품 신고 사유</label>
                            <select id="reportReason" name="reason">
                                <option value="spam">스팸</option>
                                <option value="abuse">괴롭힘</option>
                                <option value="hate">혐오</option>
                                <option value="copyright">저작권</option>
                                <option value="adult">성인물</option>
                                <option value="other">기타</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="reportDescription">운영자에게 남길 메모</label>
                            <textarea id="reportDescription" name="description">데모 신고 플로우 확인용입니다.</textarea>
                        </div>
                        <button class="secondary" type="submit">현재 사용자로 신고 생성</button>
                    </form>
                    <p class="notice" id="reportNotice"></p>
                </div>
                <div class="panel">
                    <h3>최근 댓글</h3>
                    <div class="stack" id="activityList"></div>
                </div>
            </section>

            <section class="section" data-section="profile">
                <div class="panel" id="profilePanel"></div>
                <div class="panel">
                    <h3>커뮤니티 사용자</h3>
                    <div class="stack" id="peopleList"></div>
                </div>
            </section>
        </div>

        <nav class="tabbar" aria-label="앱 탭">
            <button class="tab active" type="button" data-tab="feed"><span>⌂</span>피드</button>
            <button class="tab" type="button" data-tab="upload"><span>＋</span>등록</button>
            <button class="tab" type="button" data-tab="activity"><span>◌</span>활동</button>
            <button class="tab" type="button" data-tab="profile"><span>◇</span>프로필</button>
        </nav>
    </main>

    <script>
        const api = {
            users: "/api/users/",
            works: "/api/works/",
            comments: "/api/comments/",
            reports: "/api/reports/",
        };

        const state = {
            users: [],
            works: [],
            comments: [],
            reports: [],
            activeUserId: null,
            selectedWorkId: null,
            section: "feed",
            feedMode: "all",
        };

        const $ = (selector) => document.querySelector(selector);
        const $$ = (selector) => [...document.querySelectorAll(selector)];

        const labels = {
            image: "이미지",
            video: "영상",
            audio: "오디오",
            illustration: "그림",
            other: "기타",
            overall: "전체",
            story: "스토리",
            visual: "비주얼",
            sound: "사운드",
            editing: "편집",
            emotion: "감정",
        };

        function unwrap(payload) {
            return Array.isArray(payload) ? payload : payload.results || [];
        }

        async function requestAll(url) {
            const items = [];
            let nextUrl = url;
            while (nextUrl) {
                const payload = await request(nextUrl);
                items.push(...unwrap(payload));
                nextUrl = payload.next || null;
            }
            return items;
        }

        async function request(url, options = {}) {
            const response = await fetch(url, {
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {}),
                },
                ...options,
            });
            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || `${response.status} ${response.statusText}`);
            }
            return response.json();
        }

        function activeUser() {
            return state.users.find((user) => user.id === Number(state.activeUserId)) || state.users[0] || null;
        }

        function selectedWork() {
            return state.works.find((work) => work.id === Number(state.selectedWorkId)) || state.works[0] || null;
        }

        function commentsFor(workId) {
            return state.comments.filter((comment) => comment.work === workId && comment.status === "active");
        }

        function personaMeta(user) {
            if (!user) return "게스트";
            return `${user.country_code || "KR"} · ${user.age_group || "20s"} · ${genderLabel(user.gender)}`;
        }

        function genderLabel(value) {
            return {
                undisclosed: "성별 미공개",
                female: "여성",
                male: "남성",
                non_binary: "논바이너리",
            }[value] || "성별 미공개";
        }

        function ageLabel(value) {
            return {
                "10s": "10대",
                "20s": "20대",
                "30s": "30대",
                "40s": "40대",
                "50s": "50대",
                "60s": "60대",
            }[value] || "미상";
        }

        function countBy(items, getKey) {
            return items.reduce((acc, item) => {
                const key = getKey(item) || "미상";
                acc[key] = (acc[key] || 0) + 1;
                return acc;
            }, {});
        }

        function insightRows(counts, total) {
            return Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .map(([label, count]) => {
                    const percent = total ? Math.round((count / total) * 100) : 0;
                    return `
                        <div class="bar-row">
                            <span>${escapeHtml(label)}</span>
                            <span class="bar"><span style="width: ${percent}%"></span></span>
                            <span>${percent}%</span>
                        </div>
                    `;
                }).join("");
        }

        function strongestGroup(counts) {
            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            return sorted[0]?.[0] || "아직 없음";
        }

        function renderDemographicInsights(comments) {
            const total = comments.length;
            if (!total) {
                return `
                    <section class="insight-grid" id="demographicInsights">
                        <div class="empty">피드백이 쌓이면 나이대, 국가, 성별, 피드백 초점 기반 통계가 여기에 표시됩니다.</div>
                    </section>
                `;
            }

            const byAge = countBy(comments, (comment) => ageLabel(comment.author?.age_group));
            const byCountry = countBy(comments, (comment) => comment.author?.country_code || "미상");
            const byGender = countBy(comments, (comment) => genderLabel(comment.author?.gender));
            const byFocus = countBy(comments, (comment) => labels[comment.focus_area] || comment.focus_area);

            return `
                <section class="insight-grid" id="demographicInsights">
                    <div class="insight-card">
                        <h4>피드백 인사이트</h4>
                        <p class="insight-summary">
                            총 ${total}개의 피드백 중 ${escapeHtml(strongestGroup(byAge))}, ${escapeHtml(strongestGroup(byCountry))}, ${escapeHtml(strongestGroup(byGender))} 응답 비중이 가장 높습니다.
                            가장 많이 언급된 초점은 ${escapeHtml(strongestGroup(byFocus))}입니다.
                        </p>
                    </div>
                    <div class="insight-card">
                        <h4>나이대별 반응</h4>
                        ${insightRows(byAge, total)}
                    </div>
                    <div class="insight-card">
                        <h4>국가별 반응</h4>
                        ${insightRows(byCountry, total)}
                    </div>
                    <div class="insight-card">
                        <h4>성별 반응</h4>
                        ${insightRows(byGender, total)}
                    </div>
                    <div class="insight-card">
                        <h4>피드백 초점</h4>
                        ${insightRows(byFocus, total)}
                    </div>
                </section>
            `;
        }

        function initial(user) {
            return (user?.public_handle || "?").slice(0, 1).toUpperCase();
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function loadAll() {
            const [users, works, comments, reports] = await Promise.all([
                requestAll(api.users),
                requestAll(`${api.works}?visibility=public&status=published`),
                requestAll(api.comments),
                requestAll(api.reports),
            ]);

            state.users = users;
            state.works = works;
            state.comments = comments;
            state.reports = reports;

            if (!state.activeUserId && users.length) state.activeUserId = users[0].id;
            if (!state.selectedWorkId && works.length) state.selectedWorkId = works[0].id;
            if (state.selectedWorkId && !works.some((work) => work.id === Number(state.selectedWorkId))) {
                state.selectedWorkId = works[0]?.id || null;
            }
            render();
        }

        async function ensureStarterCommunity() {
            if (state.users.length && state.works.length) return;
            await seedCommunity(false);
        }

        function render() {
            renderSwitcher();
            renderStats();
            renderFeed();
            renderDetail();
            renderActivity();
            renderProfile();
        }

        function renderSwitcher() {
            const select = $("#activeUser");
            select.innerHTML = state.users.map((user) => `
                <option value="${user.id}" ${Number(state.activeUserId) === user.id ? "selected" : ""}>
                    ${escapeHtml(user.public_handle)} · ${escapeHtml(user.age_group)}
                </option>
            `).join("");
        }

        function renderStats() {
            $("#stats").innerHTML = [
                ["작품", state.works.length],
                ["사용자", state.users.length],
                ["댓글", state.comments.length],
                ["신고", state.reports.length],
            ].map(([label, count]) => `
                <div class="stat"><b>${count}</b><span>${label}</span></div>
            `).join("");
        }

        function visibleWorks() {
            const user = activeUser();
            let works = [...state.works];
            if (state.feedMode === "mine" && user) {
                works = works.filter((work) => work.creator?.id === user.id);
            }
            if (state.feedMode === "latest") {
                works = works.slice(0, 6);
            }
            return works;
        }

        function syncSelectedWorkWithVisibleFeed(works) {
            if (!works.length) return;
            if (!works.some((work) => work.id === Number(state.selectedWorkId))) {
                state.selectedWorkId = works[0].id;
            }
        }

        function renderFeed() {
            const works = visibleWorks();
            syncSelectedWorkWithVisibleFeed(works);
            $("#feedList").innerHTML = works.length ? works.map((work) => {
                const count = commentsFor(work.id).length;
                const mine = work.creator?.id === activeUser()?.id;
                return `
                    <button class="work-row ${Number(state.selectedWorkId) === work.id ? "active" : ""}" type="button" data-work-id="${work.id}">
                        <div class="row-top">
                            <div class="creator">
                                <span class="avatar">${escapeHtml(initial(work.creator))}</span>
                                <span>
                                    <b>${escapeHtml(work.creator?.public_handle || "unknown")}</b>
                                    <span>${escapeHtml(personaMeta(work.creator))}</span>
                                </span>
                            </div>
                            <span class="chip ${mine ? "green" : "blue"}">${mine ? "내 작품" : labels[work.media_type]}</span>
                        </div>
                        <h3 class="title">${escapeHtml(work.title)}</h3>
                        <p class="summary">${escapeHtml(work.summary || work.creator_intent)}</p>
                        <div class="metrics">
                            <span class="chip">${labels[work.media_type] || work.media_type}</span>
                            <span class="chip">댓글 ${count}</span>
                            <span class="chip">공개 피드</span>
                        </div>
                    </button>
                `;
            }).join("") : `
                <div class="empty">
                    현재 사용자에게 등록된 작품이 없습니다. 등록 탭에서 작품을 올리거나, 상단의 현재 사용자를 작품 작성자로 바꿔보세요.
                </div>
            `;
        }

        function renderDetail() {
            const work = selectedWork();
            if (!work) {
                $("#workDetail").innerHTML = `
                    <h2>선택된 작품 없음</h2>
                    <p class="muted">커뮤니티 샘플을 채우면 여러 사용자의 작품과 댓글이 표시됩니다.</p>
                `;
                return;
            }

            const comments = commentsFor(work.id);
            $("#workDetail").innerHTML = `
                <h2>${escapeHtml(work.title)}</h2>
                <p class="muted">${escapeHtml(work.creator?.public_handle || "unknown")} · ${escapeHtml(personaMeta(work.creator))}</p>
                <p class="summary">${escapeHtml(work.creator_intent)}</p>
                <div class="metrics" style="margin: 12px 0;">
                    <span class="chip blue">${labels[work.media_type] || work.media_type}</span>
                    <span class="chip green">${comments.length}개 피드백</span>
                    <span class="chip">의도 검증</span>
                </div>
                ${renderDemographicInsights(comments)}
                <form class="form" id="commentForm">
                    <div class="field">
                        <label for="focusArea">피드백 초점</label>
                        <select id="focusArea" name="focus_area">
                            <option value="overall">전체</option>
                            <option value="story">스토리</option>
                            <option value="visual">비주얼</option>
                            <option value="sound">사운드</option>
                            <option value="editing">편집</option>
                            <option value="emotion">감정</option>
                            <option value="other">기타</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="commentBody">현재 사용자로 댓글 남기기</label>
                        <textarea id="commentBody" name="body" required>의도는 잘 보입니다. 다만 초반 10초의 정보량을 조금 줄이면 감정선이 더 또렷해질 것 같아요.</textarea>
                    </div>
                    <button class="primary" type="submit">피드백 등록</button>
                </form>
                <p class="notice" id="commentNotice"></p>
                <div class="stack" style="margin-top: 12px;">
                    ${comments.length ? comments.map(renderComment).join("") : `<div class="empty">아직 댓글이 없습니다. 첫 피드백을 남겨보세요.</div>`}
                </div>
            `;
            $("#commentForm").addEventListener("submit", submitComment);
        }

        function renderComment(comment) {
            return `
                <article class="comment">
                    <div class="row-top">
                        <div class="creator">
                            <span class="avatar">${escapeHtml(initial(comment.author))}</span>
                            <span>
                                <b>${escapeHtml(comment.author?.public_handle || "unknown")}</b>
                                <span>${escapeHtml(personaMeta(comment.author))}</span>
                            </span>
                        </div>
                        <span class="chip orange">${labels[comment.focus_area] || comment.focus_area}</span>
                    </div>
                    <p>${escapeHtml(comment.body)}</p>
                </article>
            `;
        }

        function renderActivity() {
            const recent = [...state.comments].slice(-8).reverse();
            $("#activityList").innerHTML = recent.length ? recent.map((comment) => {
                const work = state.works.find((item) => item.id === comment.work);
                return `
                    <article class="comment">
                        <div class="row-top">
                            <b>${escapeHtml(comment.author?.public_handle || "unknown")}</b>
                            <span class="chip">${labels[comment.focus_area] || comment.focus_area}</span>
                        </div>
                        <p>${escapeHtml(comment.body)}</p>
                        <p class="muted">작품: ${escapeHtml(work?.title || `#${comment.work}`)}</p>
                    </article>
                `;
            }).join("") : `<div class="empty">아직 댓글 활동이 없습니다.</div>`;
        }

        function renderProfile() {
            const user = activeUser();
            const myWorks = user ? state.works.filter((work) => work.creator?.id === user.id) : [];
            const myComments = user ? state.comments.filter((comment) => comment.author?.id === user.id) : [];

            $("#profilePanel").innerHTML = user ? `
                <div class="row-top">
                    <div class="creator">
                        <span class="avatar">${escapeHtml(initial(user))}</span>
                        <span>
                            <b>${escapeHtml(user.public_handle)}</b>
                            <span>${escapeHtml(personaMeta(user))}</span>
                        </span>
                    </div>
                    <span class="chip blue">반익명</span>
                </div>
                <p class="summary" style="margin-top: 12px;">${escapeHtml(user.bio || "소개가 없습니다.")}</p>
                <div class="stats" style="margin-top: 12px;">
                    <div class="stat"><b>${myWorks.length}</b><span>내 작품</span></div>
                    <div class="stat"><b>${myComments.length}</b><span>내 댓글</span></div>
                    <div class="stat"><b>${state.reports.filter((report) => report.reporter_id === user.id).length}</b><span>내 신고</span></div>
                    <div class="stat"><b>${state.works.length}</b><span>전체 피드</span></div>
                </div>
            ` : `<div class="empty">사용자를 먼저 만들어주세요.</div>`;

            $("#peopleList").innerHTML = state.users.length ? state.users.map((person) => `
                <button class="person ${Number(state.activeUserId) === person.id ? "active" : ""}" type="button" data-user-id="${person.id}">
                    <span class="avatar">${escapeHtml(initial(person))}</span>
                    <span>
                        <b>${escapeHtml(person.public_handle)}</b>
                        <span class="muted">${escapeHtml(personaMeta(person))}</span>
                    </span>
                    <span class="chip">${state.works.filter((work) => work.creator?.id === person.id).length}개</span>
                </button>
            `).join("") : `<div class="empty">아직 사용자가 없습니다.</div>`;
        }

        async function submitComment(event) {
            event.preventDefault();
            const user = activeUser();
            const work = selectedWork();
            if (!user || !work) return;
            const form = new FormData(event.currentTarget);
            await request(api.comments, {
                method: "POST",
                body: JSON.stringify({
                    work_id: work.id,
                    author_id: user.id,
                    focus_area: form.get("focus_area"),
                    body: form.get("body"),
                    status: "active",
                }),
            });
            $("#commentNotice").textContent = `${user.public_handle} 이름으로 피드백을 등록했습니다.`;
            await loadAll();
        }

        async function submitWork(event) {
            event.preventDefault();
            const user = activeUser();
            if (!user) return;
            const form = new FormData(event.currentTarget);
            const work = await request(api.works, {
                method: "POST",
                body: JSON.stringify({
                    creator_id: user.id,
                    title: form.get("title"),
                    summary: form.get("summary"),
                    creator_intent: form.get("creator_intent"),
                    media_type: form.get("media_type"),
                    visibility: "public",
                    status: "published",
                    assets: [{
                        asset_url: form.get("asset_url") || "https://example.com/demo-asset",
                        thumbnail_url: "",
                        mime_type: "",
                        sort_order: 0,
                    }],
                }),
            });
            state.selectedWorkId = work.id;
            state.feedMode = "all";
            $("#workNotice").textContent = "작품이 공개 피드에 등록됐습니다.";
            await loadAll();
            switchSection("feed");
        }

        async function submitUser(event) {
            event.preventDefault();
            const form = new FormData(event.currentTarget);
            const suffix = Date.now().toString().slice(-6);
            const handle = String(form.get("public_handle") || "creator-new").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 16);
            const user = await request(api.users, {
                method: "POST",
                body: JSON.stringify({
                    username: `${handle}-${suffix}`,
                    password: "testpass1234",
                    email: null,
                    public_handle: `${handle}-${suffix}`.slice(0, 24),
                    auth_provider: "email",
                    provider_subject: null,
                    gender: form.get("gender"),
                    country_code: String(form.get("country_code") || "KR").toUpperCase().slice(0, 2),
                    age_group: form.get("age_group"),
                    bio: form.get("bio"),
                }),
            });
            state.activeUserId = user.id;
            $("#userNotice").textContent = "새 사용자를 만들고 현재 사용자로 전환했습니다.";
            await loadAll();
        }

        async function submitReport(event) {
            event.preventDefault();
            const user = activeUser();
            const work = selectedWork();
            if (!user || !work) return;
            const form = new FormData(event.currentTarget);
            await request(api.reports, {
                method: "POST",
                body: JSON.stringify({
                    reporter_id: user.id,
                    work_id: work.id,
                    comment_id: null,
                    reported_user_id: null,
                    reason: form.get("reason"),
                    description: form.get("description"),
                    status: "open",
                }),
            });
            $("#reportNotice").textContent = `${work.title} 신고 레코드를 생성했습니다.`;
            await loadAll();
        }

        async function seedCommunity(showNotice = true) {
            const suffix = Date.now().toString().slice(-6);
            const personas = [
                ["film-eye", "30s", "KR", "female", "편집 리듬과 장면 호흡을 주로 봅니다."],
                ["sound-scout", "20s", "US", "undisclosed", "사운드, 몰입감, 첫인상 피드백을 남깁니다."],

            const workPayloads = [

                [users[1], "도시 소음 앰비언스", "반복 청취해도 피로하지 않은지 궁금합니다.", "노이즈가 음악처럼 느껴지는 균형점을 찾고 있습니다.", "audio"],
                [users[2], "전시 포스터 시안", "문구 위계와 첫인상이 명확한지 피드백을 받고 싶습니다.", "작품보다 메시지가 먼저 보이되 너무 설명적으로 보이지 않게 만들고 싶습니다.", "image"],
                [users[3], "캐릭터 표정 연구", "감정 변화가 한눈에 읽히는지 보고 싶습니다.", "작은 얼굴 변화만으로 망설임과 결심이 구분되게 하는 것이 목표입니다.", "illustration"],
            ];

            const works = [];
            for (const [creator, title, summary, intent, mediaType] of workPayloads) {
                works.push(await request(api.works, {

                        creator_id: creator.id,
                        title,
                        summary,
                        creator_intent: intent,
                        media_type: mediaType,
                        visibility: "public",
                        status: "published",
                        assets: [{
                            asset_url: "https://example.com/community-demo",
                            thumbnail_url: "",

                [works[0], users[1], "sound", "발소리와 배경음의 거리가 좋아요. 다만 마지막 컷 직전에는 소리를 한 번 덜어내면 더 긴장될 것 같습니다."],
                [works[0], users[3], "emotion", "불안은 잘 느껴지는데 주인공이 무엇을 두려워하는지는 한 컷 정도 더 필요해 보여요."],
                [works[1], users[0], "overall", "초반 20초는 몰입감이 강합니다. 중반부 고역대가 조금 날카로워서 모바일 스피커에서는 피로할 수 있어요."],
                [works[2], users[3], "visual", "타이틀은 강하지만 날짜 정보가 늦게 읽힙니다. 하단 정보 블록 대비를 조금만 올려보면 좋겠습니다."],
                [works[3], users[2], "story", "왼쪽에서 오른쪽으로 갈수록 결심이 생기는 흐름이 잘 보여요. 두 번째 표정만 더 애매해도 자연스러울 듯합니다."],
                [works[2], users[1], "overall", "처음 봤을 때 전시 성격은 바로 이해됐습니다. 썸네일 크기에서도 읽히는지 확인하면 좋겠습니다."],

            for (const [work, author, focusArea, body] of comments) {

            state.activeUserId = users[0].id;
            state.selectedWorkId = works[0].id;
            if (showNotice) $("#seedCommunity").textContent = "샘플 추가 완료";
            await loadAll();
        }

        function switchSection(section) {
            state.section = section;
            $$(".section").forEach((element) => element.classList.toggle("active", element.dataset.section === section));
            $$(".tab").forEach((element) => element.classList.toggle("active", element.dataset.tab === section));
        }

        document.addEventListener("click", (event) => {
            const workButton = event.target.closest("[data-work-id]");
            if (workButton) {
                state.selectedWorkId = Number(workButton.dataset.workId);
                render();
                return;
            }

            const userButton = event.target.closest("[data-user-id]");
            if (userButton) {
                state.activeUserId = Number(userButton.dataset.userId);
                render();
                return;
            }

            const tab = event.target.closest("[data-tab]");
            if (tab) {
                switchSection(tab.dataset.tab);
            }
        });

        $$(".segment").forEach((button) => {
            button.addEventListener("click", () => {
                state.feedMode = button.dataset.mode;
                $$(".segment").forEach((item) => item.classList.toggle("active", item === button));
                renderFeed();
                renderDetail();
            });
        });

        $("#activeUser").addEventListener("change", (event) => {
            state.activeUserId = Number(event.target.value);
            render();
        });

        $("#refresh").addEventListener("click", loadAll);
        $("#seedCommunity").addEventListener("click", () => seedCommunity(true));
        $("#workForm").addEventListener("submit", submitWork);
        $("#userForm").addEventListener("submit", submitUser);
        $("#reportForm").addEventListener("submit", submitReport);

        loadAll()
            .then(ensureStarterCommunity)
            .catch((error) => {
                $("#feedList").innerHTML = `<div class="empty">API 연결 실패: ${escapeHtml(error.message)}</div>`;
            });
    </script>
</body>
</html>
